name: kt-antigravity-plugin
version: 0.1.0
framework: '>=2.3.0,<3.0.0'
description: Reuse a local agy sign-in as a KohakuTerrarium provider.
llm_backends:
- name: google-antigravity-plugin
  module: kt_antigravity_login.provider
  class: AntigravityProvider
  display_name: Google Antigravity (Plugin)
  description: Reuse the local agy login.
  credentials: external
  provider_native_tools: []
  owns_builtin: false
  auth:
    module: kt_antigravity_login.status
    class: AntigravityAuth
    local_only: true
    login_hint: Run agy to sign in.
llm_presets:
- name: gemini-4-carbon
  provider: google-antigravity-plugin
  model: gemini-4-carbon
  max_context: 256000
  max_output: 65536
  provider_native_tools: []
  reasoning_effort: medium
  variation_groups:
    reasoning:
      low:
        reasoning_effort: low
      medium:
        reasoning_effort: medium
      high:
        reasoning_effort: high
    context:
      256k:
        max_context: 256000
      512k:
        max_context: 512000
      900k:
        max_context: 900000
- name: gemini-4-argon
